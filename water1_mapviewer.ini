; Water1 Map Viewer default settings.
; Relative paths are resolved relative to this file's directory.
[paths]
original_data_directory=../water1eng
output_directory=output

; Both automatic actions run only when their saved/configured path exists and passes
; the same package or SAVE.DAT validation used by the corresponding File menu action.
[automation]
open_generated_map_package=true
auto_load_optional_save_data=true
optional_save_data_path=../water1eng/SAVE.DAT
